# Giftly with Docker Compose. Put your own changes in compose.override.yaml (Compose merges it
# automatically, and install.sh never touches it). install.sh manages this file: it replaces the
# image tags below with the exact digests it installed (so a rollback runs the exact same images).
services:
  giftly:
    # ":4" follows fixes and features within 4.x (never a breaking 5.0). Set GIFTLY_TAG in .env
    # to pin an exact version (e.g. 4.0.0) or to "latest".
    image: ghcr.io/dfloureiro/giftly:${GIFTLY_TAG:-4}
    # build: .            # uncomment to build locally instead
    restart: unless-stopped
    env_file: .env        # Giftly's settings only
    volumes:
      - ./data:/data      # data releases: data/current -> data/releases/<date>/ (see the README)
    ports:
      - "127.0.0.1:${GIFTLY_PORT:-3000}:3000"   # local only; remove if you only use the tunnel

  # Optional: expose through Cloudflare Tunnel (no ports opened on your router).
  # Put TUNNEL_TOKEN=... in cloudflared.env (not .env: Giftly never sees the token), then:
  #   docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    # /ready on the metrics port (inside the Docker network only) lets install.sh check the tunnel.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 run
    env_file:
      - path: cloudflared.env
        required: false
    depends_on:
      giftly:
        condition: service_healthy
