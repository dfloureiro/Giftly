name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Smoke test
        run: |
          docker build -t giftly-test .
          # No published ports: checks run inside the container, so nothing on the runner can clash.
          docker run -d --name t -e ADMIN_PASSWORD=ci-password-123 giftly-test
          trap 'docker logs t; docker rm -f t' EXIT
          check() { docker exec t wget -qO- "http://$1:3000$2"; }
          for i in $(seq 1 20); do check 127.0.0.1 /healthz && break; sleep 1; done
          for host in 127.0.0.1 localhost; do
            body=$(check "$host" /)
            grep -q Giftly <<<"$body"
          done
          docker exec t sh -c 'ps -o user,args | grep -q "^node .*server.js"'   # runs unprivileged

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/giftly
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
