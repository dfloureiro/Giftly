name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Weekly rebuild so `latest` picks up Node/Alpine security fixes even without code changes.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Smoke test
        run: |
          # On failure, publish the last command's output and the container logs as an annotation.
          report() {
            code=$?
            [ "$code" = 0 ] && { docker rm -f giftly-smoke >/dev/null 2>&1; return; }
            msg="exit $code at: $BASH_COMMAND"$'\n'"--- output:"$'\n'"$(tail -c 3000 /tmp/out 2>/dev/null)"
            msg+=$'\n'"--- docker ps -a:"$'\n'"$(docker ps -a 2>&1)"$'\n'"--- logs:"$'\n'"$(docker logs giftly-smoke 2>&1 | tail -40)"
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=Smoke test::$msg"
            docker rm -f giftly-smoke >/dev/null 2>&1
          }
          trap report EXIT
          run() { "$@" >/tmp/out 2>&1 || { cat /tmp/out; return 1; }; cat /tmp/out; }

          run docker build -t giftly-test .
          # No published ports: checks run inside the container, so nothing on the runner can clash.
          run docker run -d --name giftly-smoke -e ADMIN_PASSWORD=ci-password-123 giftly-test
          check() { docker exec giftly-smoke wget -qO- "http://$1:3000$2"; }
          for i in $(seq 1 20); do check 127.0.0.1 /healthz >/tmp/out 2>&1 && break; sleep 1; done
          for host in 127.0.0.1 localhost; do
            body=$(check "$host" / 2>/tmp/out)
            grep -q Giftly <<<"$body"
          done
          run docker exec giftly-smoke sh -c 'ps -o user,args | grep "^node .*server.js"'

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/giftly
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true                                          # always start from the newest base image
          no-cache: ${{ github.event_name == 'schedule' }}    # weekly rebuild: no stale layers
          cache-from: type=gha
          cache-to: type=gha,mode=max
