version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Stay on the Node LTS line chosen in the Dockerfile; bump majors by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
